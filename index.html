<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termin vereinbaren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-gradient"></div>

  <header class="header">
    <span class="logo">Atelier</span>
  </header>

  <main class="main">
    <section class="hero">
      <p class="hero-label">Persönliche Beratung</p>
      <h1 class="hero-title">Ihr Termin,<br>in besten Händen.</h1>
      <p class="hero-text">
        Hinterlassen Sie uns Ihre Kontaktdaten und Ihren Wunschtermin.
        Wir melden uns zeitnah bei Ihnen.
      </p>
    </section>

    <section class="form-section">
      <form id="appointment-form" class="form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Max Mustermann"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">E-Mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="max@beispiel.de"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="date">Wunschtermin</label>
          <input
            type="datetime-local"
            id="date"
            name="date"
            required
          >
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="btn-text">Termin anfragen</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>

        <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Atelier. Alle Rechte vorbehalten.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
